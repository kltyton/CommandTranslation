repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        if (pluginManager.hasPlugin('net.minecraftforge.gradle')) { forRepositories(fg.repository) }
        filter { includeGroup 'maven.modrinth' }
    }
}

def githubArtifact = nbtacArtifact.id.startsWith('github-')
def artifactVersion = nbtacArtifact.modId == 'nbtac' ? nbtacArtifact.version : nbtacArtifact.id
def coordinate
if (githubArtifact) {
    def classifier = nbtacArtifact.filename.substring('NBTac-'.length(), nbtacArtifact.filename.length() - '.jar'.length())
    // ForgeGradle's repository parser treats dots in classifiers as extension separators.
    def dependencyClassifier = pluginManager.hasPlugin('net.minecraftforge.gradle') ? classifier.replace('.', '_') : classifier
    // This Ivy alias resolves the original GitHub asset, not a republished Maven module.
    repositories.exclusiveContent {
        forRepository {
            repositories.ivy {
                name = 'NbtAutocompleteGitHub'
                url = 'https://github.com/mt1006/mc-nbtac-mod/releases/download'
                patternLayout { artifact "[revision]/[module]-${classifier}.jar" }
                metadataSources { artifact() }
            }
        }
        if (pluginManager.hasPlugin('net.minecraftforge.gradle')) { forRepositories(fg.repository) }
        filter { includeModule 'upstream.github.mt1006', 'NBTac' }
    }
    artifactVersion = nbtacArtifact.version
    coordinate = "upstream.github.mt1006:NBTac:${artifactVersion}:${dependencyClassifier}"
} else {
    coordinate = "maven.modrinth:nbt-autocomplete:${artifactVersion}"
}
if (loader == 'fabric') {
    dependencies.add((java_version as int) < 25 ? 'modImplementation' : 'implementation', coordinate)
    dependencies.add('include', coordinate)
} else if (loader == 'forge') {
    if (pluginManager.hasPlugin('net.minecraftforge.gradle')) {
        dependencies.add('implementation', fg.deobf(coordinate))
    } else {
        dependencies.add('modImplementation', coordinate)
    }
    if (configurations.findByName('legacyEmbedded') != null) {
        dependencies.add('legacyEmbedded', coordinate)
    } else {
        dependencies {
            jarJar(coordinate) {
                version { strictly "[${artifactVersion}]"; prefer artifactVersion }
            }
        }
    }
} else {
    dependencies {
        jarJar(implementation(coordinate)) {
            version { strictly "[${artifactVersion}]"; prefer artifactVersion }
        }
    }
}

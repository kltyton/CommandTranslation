apply from: file('../../gradle/target-conventions/base.gradle')

def legacyEmbedding = minecraft_version == '1.17.1'
if (legacyEmbedding) {
    configurations.create('legacyEmbedded') { canBeConsumed = false }
    dependencies {
        implementation 'io.github.llamalad7:mixinextras-common:0.4.1'
        legacyEmbedded 'io.github.llamalad7:mixinextras-common:0.4.1'
    }
}
repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    if (!legacyEmbedding) {
        jarJar(implementation('io.github.llamalad7:mixinextras-forge:0.4.1')) {
            version { strictly '[0.4.1,)'; prefer '0.4.1' }
        }
    }
}
mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
    config("${mod_id}.nbt.mixins.json")
}
tasks.named('jar', Jar) { manifest.attributes('MixinConfigs': "${mod_id}.mixins.json,${mod_id}.nbt.mixins.json") }

legacyForge {
    version = "${minecraft_version}-${loader_version}"
    validateAccessTransformers = true
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll('--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    *project.ext.templeDatagenExistingArgs)
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main; sourceSet project(':common').sourceSets.main } }
}
if (legacyEmbedding) {
    tasks.named('createMinecraftArtifacts') {
        toolsJavaExecutable.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(runtime_java_version as int)
        }.map { it.executablePath.asFile.absolutePath })
        disableRecompilation.set(false)
    }
}
apply from: file('../../gradle/target-conventions/pack-metadata.gradle')
apply from: file('../../gradle/target-conventions/publish.gradle')
apply from: file('../../gradle/target-conventions/nbt-autocomplete.gradle')
apply from: file('../../gradle/target-conventions/forge-common-mixin.gradle')
if (legacyEmbedding) {
    apply from: file('../../gradle/target-conventions/forge-embedded.gradle')
}

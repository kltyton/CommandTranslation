apply from: file('../../gradle/target-conventions/base.gradle')

def legacyEmbedding = (minecraft_version.tokenize('.')[1] as int) < 18
def minecraftParts = minecraft_version.tokenize('.').collect { it as int }
// Forge uses official runtime names starting with Minecraft 1.20.5.
def needsReobfuscation = minecraftParts[0] == 1 && (minecraftParts[1] < 20 ||
        (minecraftParts[1] == 20 && (minecraftParts.size() == 2 || minecraftParts[2] < 5)))
ext.templeProductionArchiveTask = legacyEmbedding ? 'jar' : 'jarJar'
ext.templeProductionReobfuscationTask = needsReobfuscation ? (legacyEmbedding ? 'reobfJar' : 'reobfJarJar') : templeProductionArchiveTask
if (legacyEmbedding) {
    configurations.create('legacyEmbedded') { canBeConsumed = false }
    dependencies {
        implementation 'io.github.llamalad7:mixinextras-common:0.4.1'
        legacyEmbedded 'io.github.llamalad7:mixinextras-common:0.4.1'
    }
} else {
    jarJar.enable()
    tasks.named('jar', Jar) { archiveClassifier.set('thin') }
    tasks.named('jarJar', Jar) {
        archiveClassifier.set('')
        from project(':common').sourceSets.main.output
        from(file('../../LICENSE')) { rename { "LICENSE_${mod_id}" } }
        from(file('../../licenses')) { into 'META-INF/licenses' }
        if (needsReobfuscation) { finalizedBy 'reobfJarJar' }
    }
    dependencies {
        jarJar(implementation('io.github.llamalad7:mixinextras-forge:0.4.1')) {
            version { strictly '[0.4.1,)'; prefer '0.4.1' }
        }
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            if (minecraft_version == '1.16.5') {
                jvmArgs '-XX:+IgnoreUnrecognizedVMOptions',
                        '--add-exports=java.base/sun.security.util=ALL-UNNAMED',
                        '--add-exports=jdk.naming.dns/com.sun.jndi.dns=java.naming',
                        '--add-opens=java.base/java.util.jar=ALL-UNNAMED'
            }
            mods { "${mod_id}" { source sourceSets.main; source project(':common').sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        data {
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    *project.ext.templeDatagenExistingArgs
        }
    }
}
dependencies { minecraft "net.minecraftforge:forge:${minecraft_version}-${loader_version}" }
dependencies { annotationProcessor 'org.spongepowered:mixin:0.8.5:processor' }
if (needsReobfuscation) { tasks.named('jar') { finalizedBy 'reobfJar' } }
apply from: file('../../gradle/target-conventions/forgegradle-common-mixin.gradle')
apply from: file('../../gradle/target-conventions/pack-metadata.gradle')
apply from: file('../../gradle/target-conventions/publish.gradle')
apply from: file('../../gradle/target-conventions/nbt-autocomplete.gradle')
if (legacyEmbedding) {
    apply from: file('../../gradle/target-conventions/forge-embedded.gradle')
}

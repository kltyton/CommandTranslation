apply from: file('../../gradle/target-conventions/base.gradle')

repositories { maven { url = 'https://maven.terraformersmc.com/releases/' } }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if ((java_version as int) < 25) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        compileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    }
}
fabricApi.configureDataGeneration {
    modId = mod_id
    createSourceSet = false
    outputDirectory = file('src/generated/resources')
    client = true
}
loom.mods {
    "${mod_id}" {
        sourceSet sourceSets.main
        sourceSet project(':common').sourceSets.main
    }
}
apply from: file('../../gradle/target-conventions/publish.gradle')
apply from: file('../../gradle/target-conventions/nbt-autocomplete.gradle')

if ((java_version as int) < 25) {
    loom.mixin.useLegacyMixinAp = true
    loom.mixin.defaultRefmapName = "${mod_id}.refmap.json"
    apply from: file('../../gradle/target-conventions/fabric-common-mixin.gradle')
}

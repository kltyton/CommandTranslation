buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
        classpath "me.modmuss50:mod-publish-plugin:${publish_plugin_version}"
    }
}
apply plugin: 'fabric-loom'
apply plugin: 'java'
apply plugin: 'me.modmuss50.mod-publish-plugin'
ext.templeRemapJarTask = net.fabricmc.loom.task.RemapJarTask
ext.templeMixinMappingService = net.fabricmc.loom.task.service.MixinAPMappingService
ext.templeRemapperService = net.fabricmc.loom.task.service.TinyRemapperService
apply from: file('../../gradle/target-conventions/fabric.gradle')

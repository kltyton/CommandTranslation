modLoader = "javafml"
loaderVersion = "${fml_version_range}"
license = "${mod_license}"

[[mixins]]
config = "command_translation.mixins.json"

[[mixins]]
config = "command_translation.nbt.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${loader_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "${nbtac_mod_id}"
type = "required"
versionRange = "[${nbtac_version},${nbtac_upper_version})"
ordering = "AFTER"
side = "CLIENT"
